<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>取引覚書</title>

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Yuji+Boku&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#eae6dc;
  --paper:#12110e;
  --border:#3a2f1c;
  --gold:#bfa45a;
  --red:#8b1e1e;
  --green:#355f4c;
}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.9)),
  repeating-linear-gradient(90deg,#2a2418 0px,#2a2418 40px,#231e14 40px,#231e14 80px);
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
  color:var(--ink);padding:28px;
}
body.buy-mode{
  background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.95)),
  repeating-linear-gradient(90deg,#1f2c26 0px,#1f2c26 40px,#1a241f 40px,#1a241f 80px);
}
.admin-btn{
  position:fixed;top:18px;right:20px;
  background:#0f0d09;border:1px solid var(--gold);
  color:var(--gold);padding:6px 12px;font-size:12px;letter-spacing:.2em;cursor:pointer;
}
.card{
  max-width:520px;margin:auto;padding:26px 22px;
  background:linear-gradient(180deg,rgba(18,17,14,.95),rgba(10,9,7,.95));
  border:2px solid var(--border);
}
h2{text-align:center;letter-spacing:.35em;color:var(--gold);}
.subtitle{text-align:center;font-size:11px;opacity:.6;margin:6px 0 18px;}

input,select{
  width:100%;height:36px;padding:6px 8px;
  background:#0b0a08;border:1px solid #4a3c22;color:var(--ink);
}

.form-group{display:grid;gap:12px;margin-bottom:16px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{
  flex:1;padding:10px;background:#0e0d0a;
  border:1px solid #4a3c22;color:#aaa;font-weight:700;cursor:pointer;
}
.tab.active{background:#1a1408;color:var(--gold);border-color:var(--gold);}

/* ▼ 見やすく強化 */
#items::before{
  content:"品目 / 単価 / 数量";
  display:grid;
  grid-template-columns:1fr 90px 80px;
  gap:12px;
  font-size:12px;
  opacity:.6;
  margin-bottom:8px;
}
.item-row{
  display:grid;
  grid-template-columns:1fr 90px 80px;
  gap:12px;
  margin-bottom:8px;
  padding:8px;
  border:1px solid #3f3420;
  background:linear-gradient(180deg,#15130f,#0e0c09);
  transition:.2s;
}
.item-row:hover{
  border-color:var(--gold);
  box-shadow:0 0 6px rgba(191,164,90,.3);
}
.item-price{
  text-align:right;
  background:#0b0a08;
  border:1px solid #4a3c22;
  color:#ddd;
  height:34px;
  padding-right:8px;
  font-weight:700;
}
.item-qty{
  text-align:center;
  height:34px;
  font-size:14px;
  border:1px solid #4a3c22;
  background:#0b0a08;
  color:var(--gold);
  font-weight:700;
}

.total-box{
  margin-top:18px;padding:14px;
  border:1px solid #4a3c22;background:#0a0907;
  display:flex;justify-content:center;gap:16px;
}
#total{font-size:24px;font-weight:900;color:var(--red);}
body.buy-mode #total{color:var(--green);}

button{
  width:100%;margin-top:18px;padding:14px;
  background:#120f0a;color:var(--gold);
  border:2px solid var(--border);
  font-weight:900;cursor:pointer;
}
</style>
</head>

<body>

<button class="admin-btn" onclick="location.href='admin.html'">⚙ 管理</button>

<div class="card">
  <h2>Smoke is Life(SiL)</h2>
  <div class="subtitle">― 煙 命 ―</div>

  <div class="form-group">
    <input id="shop" placeholder="差配人（任意）">
    <select id="name"><option value="">通り名を選択</option></select>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="sell">渡す</button>
    <button class="tab" data-mode="buy">受ける</button>
  </div>

  <div id="items"></div>

  <div class="total-box">
    <span id="totalLabel">支払額</span>
    <strong id="total">¥0</strong>
  </div>

  <button id="sendBtn">帳面に記す</button>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1449381615452028938/OD8djOLo9HwJNpoJ0oe7GBea9tsJqoL70ASz6J_VChsRmvbBDU7i4KGp_nQK2ML5tWSM"; // ← DiscordのWebhook

let mode="sell";

function getItems(){ return JSON.parse(localStorage.getItem("silItems")||"{}"); }
function getNames(){ return JSON.parse(localStorage.getItem("silNames")||"[]"); }

function loadNames(){
  const select=document.getElementById("name");
  select.innerHTML='<option value="">通り名を選択</option>';
  getNames().forEach(n=>{
    const opt=document.createElement("option");
    opt.textContent=n;
    select.appendChild(opt);
  });
}
loadNames();

const itemsEl=document.getElementById("items");
const totalEl=document.getElementById("total");
const totalLabel=document.getElementById("totalLabel");

function render(){
  const data=getItems();
  if(!data[mode]) return;
  itemsEl.innerHTML="";
  data[mode].forEach(i=>{
    itemsEl.innerHTML+=`
      <div class="item-row">
        <div>${i.alias||i.name}</div>
        <input class="item-price" value="¥${Number(i.price).toLocaleString()}" readonly>
        <input class="item-qty" type="number" value="0" min="0">
      </div>`;
  });
  totalEl.textContent="¥0";
  totalLabel.textContent=mode==="sell"?"支払額":"受取額";
  document.body.classList.toggle("buy-mode",mode==="buy");
}
render();

document.addEventListener("input",()=>{
  let t=0;
  document.querySelectorAll(".item-row").forEach(r=>{
    const price = Number(r.children[1].value.replace(/[¥,]/g,""));
    const qty = Number(r.children[2].value);
    t += price * qty;
  });
  totalEl.textContent=`¥${t.toLocaleString()}`;
});

document.querySelectorAll(".tab").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    mode=b.dataset.mode;
    render();
  };
});

document.getElementById("sendBtn").onclick=async()=>{
  const shop=document.getElementById("shop").value||"（差配人なし）";
  const name=document.getElementById("name").value||"（名無し）";

  let details="";
  let total=0;

  document.querySelectorAll(".item-row").forEach(r=>{
    const item=r.children[0].textContent;
    const price=Number(r.children[1].value.replace(/[¥,]/g,""));
    const qty=Number(r.children[2].value);
    if(qty>0){
      details+=`・${item} ×${qty} = ¥${(price*qty).toLocaleString()}\n`;
      total+=price*qty;
    }
  });

  if(total===0){ alert("数量が入力されていません"); return; }

  const message={
    content:
`📖 **取引記録**
モード：${mode==="sell"?"渡す":"受ける"}
差配人：${shop}
通り名：${name}

${details}
合計：¥${total.toLocaleString()}`
  };

  await fetch(WEBHOOK_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(message)
  });

  alert("帳面に記録しました（Discord送信済み）");
  render();
};
</script>
</body>
</html>
